<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ollama Chat</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <div class="sidebar">
    <div class="brand">Ollama Chat</div>
    <div class="chat-list" id="chat-list"></div>
    <button onclick="newChat()">New Chat</button>
  </div>
  <div class="main">
    <div class="header">
      <div>Memory-aware Chat</div>
      <button id="theme-toggle">Toggle Theme</button>
    </div>
    <div class="history" id="history"></div>
    <div class="typing" id="typing" style="display:none;">
      <div class="dot"></div><div class="dot"></div><div class="dot"></div>
    </div>
    <div class="footer">
      <div class="input-bar">
        <textarea id="input" placeholder="Type a message. Use <web.search> or <recall> to trigger tools." rows="2"></textarea>
        <button id="send-btn">Send</button>
      </div>
    </div>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
